function shOff(c){c.shadowColor='rgba(0,0,0,0)';c.shadowBlur=0;c.shadowOffsetX=0;c.shadowOffsetY=0}
function star(c,x,y,r,col,n=5){c.beginPath();for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,q=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}c.closePath();fill(c,col)}
function sprinkle(c,x,y,a,len,col){c.save();c.translate(x,y);c.rotate(a);rr(c,-len/2,-len*.16,len,len*.32,len*.16);fill(c,col);c.restore()}
function eye(c,x,y,rx,ry,lookX,lookY,angry,blink){
 ell(c,x,y,rx,ry*(blink?.12:1));fill(c,'#fff');if(blink)return;
 circ(c,x+lookX*rx*.35,y+lookY*ry*.3,rx*.55);fill(c,'#1a0d08');circ(c,x+lookX*rx*.35-rx*.2,y+lookY*ry*.3-ry*.25,rx*.18);fill(c,'#fff');
 if(angry){c.beginPath();c.moveTo(x-rx*1.2,y-ry*(angry>0?1.3:.9));c.lineTo(x+rx*1.2,y-ry*(angry>0?.9:1.3));c.lineTo(x+rx*1.2,y-ry*2);c.lineTo(x-rx*1.2,y-ry*2);c.closePath();fill(c,angry.col||'#000')}}

/* ================= Grit: grime, graffiti, film grade ================= */
function grime(c,x0,y0,w,h,R,k=1){
 const n=Math.round(w*h*.05*k)+2;
 for(let i=0;i<n;i++){const x=x0+R()*w,y=y0+R()*h,r=.5+R()*2.2,a=(.07+R()*.16)*k,g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(38,24,12,${a})`);g.addColorStop(1,'rgba(38,24,12,0)');c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2)}
 for(let i=0;i<w*.55*k;i++){const x=x0+R()*w,y=y0+R()*h*.7,l=.6+R()*3,wd=.025+R()*.07,g=c.createLinearGradient(0,y,0,y+l);g.addColorStop(0,`rgba(28,18,8,${.3*k})`);g.addColorStop(1,'rgba(28,18,8,0)');c.fillStyle=g;c.fillRect(x,y,wd,l)}
 c.lineWidth=.022;c.strokeStyle=`rgba(12,8,5,${Math.min(.6,.45*k)})`;for(let i=0;i<w*.16*k;i++){let x=x0+R()*w,y=y0+R()*h;c.beginPath();c.moveTo(x,y);const st=3+R()*5;for(let q=0;q<st;q++){x+=(R()-.5)*.45;y+=.05+R()*.3;c.lineTo(x,y)}c.stroke()}
 for(let i=0;i<w*h*.45*k;i++){c.fillStyle=R()<.6?`rgba(0,0,0,${.1+R()*.22})`:`rgba(255,240,220,${.04+R()*.07})`;const z=.015+R()*.05;c.fillRect(x0+R()*w,y0+R()*h,z,z)}}
const TAGS=['GLAZE','RUN!','NO BITES','HOLE GANG','DOUGH BOYZ','ROLL OUT','NAH','SWEET CREW','EAT THIS','GLAZED & CONFUSED','DUNK U'];
const TAGCOL=['#6fd0c0','#e94f64','#f2c14e','#d9d2c4','#9c7cff','#7fd36a'];
function graffiti(c,x,y,sz,txt,col,rot){c.save();c.translate(x,y);c.rotate(rot);c.font=`${sz}px Permanent Marker,cursive`;c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';
 c.lineWidth=sz*.18;c.strokeStyle='rgba(8,6,6,.7)';c.strokeText(txt,0,0);c.fillStyle=col;c.globalAlpha*=.88;c.fillText(txt,0,0);
 const m=c.measureText(txt).width,R=rng((x*131+y*977)|0);for(let i=0;i<4+R()*4;i++){const dx=(R()-.5)*m*.9,l=sz*(.2+R()*.9);c.fillRect(dx,sz*.25,sz*.05,l);circ(c,dx+sz*.025,sz*.25+l,sz*.045);fill(c,col)}c.restore()}
function grade(c,W,H,t,k=1){c.save();c.setTransform(1,0,0,1,0,0);
 c.globalCompositeOperation='saturation';c.fillStyle=`rgba(128,128,128,${.36*k})`;c.fillRect(0,0,W,H);
 c.globalCompositeOperation='multiply';c.fillStyle=`rgba(200,172,145,${.5*k})`;c.fillRect(0,0,W,H);
 c.globalCompositeOperation='source-over';
 const v=c.createRadialGradient(W/2,H*.48,Math.min(W,H)*.3,W/2,H*.5,Math.max(W,H)*.72);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,`rgba(8,5,3,${.6*k})`);c.fillStyle=v;c.fillRect(0,0,W,H);
 const R=rng(Math.floor(t*18)+1),u=Math.max(1,W/800);
 if(R()<.3){c.fillStyle=`rgba(255,245,225,${.07+R()*.1})`;c.fillRect(R()*W,0,u,H)}
 for(let i=0;i<3;i++)if(R()<.35){c.fillStyle=R()<.6?`rgba(0,0,0,${.3+R()*.3})`:`rgba(255,245,225,${.2+R()*.2})`;const z=(1+R()*2.5)*u;c.fillRect(R()*W,R()*H,z,z*(R()<.3?4:1))}
 c.restore()}

 {const fl=Math.sin(t*15+(o.run||0))*.035+(o.air?.04:0);c.fillStyle='#861c23';c.beginPath();c.moveTo(-.37,-.35);c.quadraticCurveTo(-.54,-.44+fl,-.7,-.38+fl*2);c.lineTo(-.66,-.31+fl*2);c.quadraticCurveTo(-.52,-.33,-.38,-.3);c.closePath();c.fill();
