<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Donut Patrol</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Shrikhand&display=swap">
<style>
/* Layout: a donut-shop signboard HUD over an illustrated city diorama, with a thumb pad below when the phone is tall enough. */
:root{
  --night:#16173a;--night-2:#23255c;--ink:#2a160d;--frost:#ff7ab5;--frost-2:#ff4d97;--glaze:#ffe9c7;--choc:#6a3820;--blue:#3d78e6;--mint:#76e1c4;--sun:#ffc94a;--line:#fff8ee;--muted:#b9b7ea;
  --display:'Shrikhand','Cooper Black','Georgia',serif;--ui:'Rubik',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--night);color:var(--line);font-family:var(--ui);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#app{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;touch-action:none;
  background:radial-gradient(120% 70% at 50% 0%,#2b2d6e 0%,var(--night) 60%) var(--night)}
#hud{width:100%;max-width:560px;box-sizing:border-box;display:grid;grid-template-columns:1fr auto 1fr auto;align-items:center;gap:10px;
  padding:8px max(14px,env(safe-area-inset-right,0px)) 6px max(14px,env(safe-area-inset-left,0px))}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0}
.stat small{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.stat b{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05}
.stat.r{text-align:right}
#lvl{display:flex;flex-direction:column;align-items:center;background:var(--frost);color:var(--ink);border-radius:999px;padding:4px 14px 5px;
  box-shadow:0 3px 0 var(--choc),inset 0 -3px 0 rgba(0,0,0,.08);transform:rotate(-2deg)}
#lvl span:first-child{font:800 9px/1 var(--ui);letter-spacing:.18em;text-transform:uppercase}
#lvl span:last-child{font:400 15px/1.15 var(--display);white-space:nowrap}
#pause{width:38px;height:38px;border-radius:50%;border:0;background:#2c2e70;color:var(--line);display:grid;place-items:center;padding:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
#pause svg{width:16px;height:16px}
#stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#cv{display:block;border-radius:12px;box-shadow:0 0 0 3px #0b0c26,0 0 0 6px #3a3c8a,0 14px 40px rgba(0,0,0,.55)}
#foot{width:100%;max-width:560px;box-sizing:border-box;display:flex;align-items:center;gap:14px;
  padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
#lives{display:flex;gap:4px;min-width:70px}
#lives svg{width:24px;height:18px}
#meter{flex:1;position:relative;height:22px;border-radius:999px;background:#2a2c66;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.25)}
#meterFill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#ff9ccb,var(--frost));border-radius:999px;transition:width .2s}
#meterFill::after{content:"";position:absolute;inset:4px 8px auto 8px;height:3px;border-radius:3px;
  background:repeating-linear-gradient(90deg,#fff 0 6px,transparent 6px 14px,#7de0ff 14px 20px,transparent 20px 28px,#ffe066 28px 34px,transparent 34px 42px);opacity:.9}
#left{position:absolute;inset:0;display:grid;place-items:center;font:800 11px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--line);text-shadow:0 1px 0 rgba(0,0,0,.45)}
#pad{flex:none;display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,40px);gap:4px;padding-bottom:max(60px,calc(env(safe-area-inset-bottom,0px) + 52px));touch-action:none}
#pad button{border:0;border-radius:12px;background:#2a2c66;color:var(--glaze);display:grid;place-items:center;padding:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
#pad button.on{background:var(--frost);color:var(--ink)}
#pad svg{width:20px;height:20px}
#pU{grid-area:1/2}#pL{grid-area:2/1}#pR{grid-area:2/3}#pD{grid-area:3/2}
#pad .hint{grid-area:2/2;display:grid;place-items:center;font:700 9px/1.2 var(--ui);color:var(--muted);text-align:center;letter-spacing:.06em;text-transform:uppercase}

#screen{position:absolute;inset:0;z-index:5;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));
  background:
   radial-gradient(circle at 12px 14px,#ff7ab5 0 2px,transparent 2.5px),radial-gradient(circle at 44px 40px,#7de0ff 0 2px,transparent 2.5px),
   radial-gradient(circle at 30px 6px,#ffe066 0 2px,transparent 2.5px),radial-gradient(circle at 54px 18px,#9bf0a0 0 2px,transparent 2.5px),
   radial-gradient(110% 80% at 50% 0%,#2f3180 0%,#15163a 70%);
  background-size:64px 52px,64px 52px,64px 52px,64px 52px,100% 100%}
#screen.dim{background:rgba(14,15,40,.86)}
#screen>*{flex:none;max-width:100%}
#screen>:first-child{margin-top:auto}#screen>:last-child{margin-bottom:auto}
.logo{margin:0;text-align:center;font:400 clamp(46px,15vw,78px)/.9 var(--display);color:var(--frost);letter-spacing:.01em;text-wrap:balance;
  -webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 var(--choc),0 7px 0 var(--ink),0 14px 22px rgba(0,0,0,.45);transform:rotate(-4deg)}
.logo span{display:block;color:var(--glaze)}
.tag{margin:0;font:500 14px/1.45 var(--ui);color:var(--muted);text-align:center;max-width:32ch}
.hero{width:min(100%,420px);aspect-ratio:4/3;display:block}
.menu{display:flex;flex-direction:column;gap:10px;width:min(100%,380px)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.btn{appearance:none;border:0;border-radius:16px;min-height:52px;padding:12px 16px;font:400 21px/1 var(--display);color:var(--ink);background:var(--glaze);
  box-shadow:0 5px 0 #c99a6b,0 7px 0 var(--ink);transform:translateY(0)}
.btn.go{background:var(--frost);box-shadow:0 5px 0 #c4407e,0 7px 0 var(--ink)}
.btn.q{font:700 14px/1 var(--ui);letter-spacing:.04em;background:#2c2e70;color:var(--line);box-shadow:0 4px 0 #101133;min-height:44px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.best{font:700 12px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--sun)}
h2.big{margin:0;font:400 clamp(36px,11vw,54px)/1 var(--display);color:var(--frost);-webkit-text-stroke:1.5px var(--ink);text-shadow:0 4px 0 var(--choc);text-align:center;text-wrap:balance}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(100%,420px)}
.card{background:#fff8ee;color:var(--ink);border-radius:16px;padding:10px 10px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.card canvas{width:96px;height:96px}
.card b{font:400 19px/1 var(--display)}
.card i{font:700 10px/1.2 var(--ui);letter-spacing:.12em;text-transform:uppercase;font-style:normal}
.card p{margin:4px 0 0;font:500 12px/1.35 var(--ui);color:#5a4135}
.legend{display:flex;flex-direction:column;gap:8px;width:min(100%,420px)}
.leg{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;background:#2a2c66;border-radius:14px;padding:6px 12px 6px 6px;font:500 13px/1.35 var(--ui)}
.leg canvas{width:44px;height:44px}
.leg b{font-weight:800;color:var(--sun)}
.final{font:800 46px/1 var(--ui);font-variant-numeric:tabular-nums;color:var(--glaze)}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}#meterFill{transition:none}}
</style>

<div id="app">
  <header id="hud">
    <div class="stat"><small>Score</small><b id="sc">0</b></div>
    <div id="lvl"><span id="lvlNum">Level 1</span><span id="lvlName">Morning Beat</span></div>
    <div class="stat r"><small>Best</small><b id="hi">0</b></div>
    <button id="pause" aria-label="Pause"><svg viewBox="0 0 16 16"><rect x="3" y="2" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="currentColor"/></svg></button>
  </header>
  <main id="stage"><canvas id="cv" aria-label="Donut Patrol city map"></canvas></main>
  <footer id="foot">
    <div id="lives" aria-label="Lives"></div>
    <div id="meter"><div id="meterFill"></div><span id="left">0 donuts left</span></div>
  </footer>
  <div id="pad">
    <button id="pU" data-d="0,-1" aria-label="Up"><svg viewBox="0 0 20 20"><path d="M10 3 18 15H2z" fill="currentColor"/></svg></button>
    <button id="pL" data-d="-1,0" aria-label="Left"><svg viewBox="0 0 20 20"><path d="M3 10 15 2v16z" fill="currentColor"/></svg></button>
    <span class="hint">or<br>swipe</span>
    <button id="pR" data-d="1,0" aria-label="Right"><svg viewBox="0 0 20 20"><path d="M17 10 5 2v16z" fill="currentColor"/></svg></button>
    <button id="pD" data-d="0,1" aria-label="Down"><svg viewBox="0 0 20 20"><path d="M10 17 2 5h16z" fill="currentColor"/></svg></button>
  </div>
  <div id="screen"></div>
</div>

<script>
(()=>{'use strict';
const COLS=19,ROWS=22,TAU=Math.PI*2;
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const store={get(k,d){try{const v=localStorage.getItem('dp-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('dp-'+k,JSON.stringify(v))}catch(e){}}};
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const MAPS=[{"name": "Main Street", "rows": ["###################", "#.................#", "#o##.##.###.##.##o#", "#.##.##.###.##.##.#", "#.......###.......#", "#.##.##.###.##.##.#", "#.##.##.###.##.##.#", "#.................#", "#.##.##HH-HH##.##.#", "#.##.##HBBBH##.##.#", "#.##.##HHHHH##.##.#", " ................. ", "#.##.##.###.##.##.#", "#.##.##.###.##.##.#", "#........*........#", "#.#####.###.#####.#", "#.#####.###.#####.#", "#.##.....P.....##.#", "#o##.##.###.##.##o#", "#.##.##.###.##.##.#", "#.................#", "###################"]}, {"name": "Sprinkle Heights", "rows": ["###################", "#.................#", "#.#######.#######.#", "#o#######.#######o#", "#.#######.#######.#", "#.................#", "#.###.###.###.###.#", "#.###.###.###.###.#", "#.................#", "#.###.HHH-HHH.###.#", "#.###.HBBBBBH.###.#", "#.###.HHHHHHH.###.#", " ........*........ ", "#.###.###.###.###.#", "#.###.........###.#", "#.###.###.###.###.#", "#........P........#", "#.###.###.###.###.#", "#o###.###.###.###o#", "#.###.###.###.###.#", "#.................#", "###################"]}];

/* ---------------- Themes ---------------- */
const THEMES=[
 {id:'morning',name:'Morning Beat',asphalt:'#5a5d6c',speck:['#686c7c','#4c4f5d'],side:'#ddd5c5',curb:'#a79f90',grass:'#8fcb6a',grass2:'#84c060',tree:['#3d8649','#4fa158','#6abb69'],hedge:'#4b8c45',water:'#5cc8dc',path:'#eedcb6',
  roofs:['#f4a259','#e76f6f','#6fb7bd','#b98fb0','#f6d27a','#8fb3dc','#d0a27a','#a5c98c'],shadow:'rgba(30,24,64,.36)',sx:.16,sy:.22,weather:'clouds',awn:['#e7546b','#3d9be0','#f2b33d','#4caf7a']},
 {id:'sunset',name:'Sunset Shift',asphalt:'#5c4b66',speck:['#6b5877','#4e3f58'],side:'#ebc8ad',curb:'#b8907b',grass:'#a8b85d',grass2:'#9aab53',tree:['#55733b','#6a8a44','#89a653'],hedge:'#5d7a3a',water:'#7aa8d8',path:'#f2cfa3',
  roofs:['#f08a5d','#c84b6a','#7d4f8c','#f6c667','#f4a47a','#d0708a','#53709a','#e3a35b'],shadow:'rgba(56,20,76,.45)',sx:.46,sy:.1,weather:'sunset',awn:['#ff6f61','#ffd166','#7b5ea7','#2ec4b6']},
 {id:'night',name:'Graveyard Shift',asphalt:'#3a3e52',speck:['#464b62','#313545'],side:'#a7a3b6',curb:'#77728e',grass:'#4d7b57',grass2:'#46724f',tree:['#23523a','#2c6344','#3a7a52'],hedge:'#29593a',water:'#3a6e9a',path:'#b7ac99',
  roofs:['#c46a5a','#8a5a8f','#4f8a92','#c9a55a','#6a7fb0','#a3705a','#5d8a6a','#b06a86'],shadow:'rgba(6,6,24,.42)',sx:.1,sy:.12,weather:'rain',dark:1,awn:['#ff4f8f','#3fd0ff','#ffcc33','#8c6cff']},
 {id:'snow',name:'Snow Day',asphalt:'#6b7284',speck:['#7a8193','#5e6476'],side:'#eef3f9',curb:'#c0c9d8',grass:'#f3f7fc',grass2:'#e7eff8',tree:['#2e6a51','#3a7c5f','#4a906f'],hedge:'#3c785c',water:'#a9d6ec',path:'#dde6f1',
  roofs:['#c8644f','#5f86b0','#d39a4a','#7d6aa6','#4f9a8a','#b0566f','#8a9aaa','#c97b4a'],shadow:'rgba(40,62,104,.3)',sx:.14,sy:.2,weather:'snow',snow:1,awn:['#d7263d','#1b998b','#f46036','#2e294e']}
];
const FROSTS=[{f:'#ff8cc6',s:1},{f:'#6b3a22',s:1,sp:['#fff','#ffe066','#ff8cc6']},{f:'#fff0d4',s:0},{f:'#7fd6ff',s:1},{f:'#ffe36e',s:1},{f:'#b28cff',s:1}];
const SPRINK=['#ff4d6d','#ffd23f','#3ec1ff','#7cff9b','#ffffff','#b47cff'];

/* ---------------- Characters ---------------- */
const BAKERS=[
 {name:'Bruno',title:'The Kneader',col:'#e63946',skin:'#eeb48b',hair:'#2b1b12',item:'pin',stache:1,about:'Charges straight at you. Never takes a coffee break.'},
 {name:'Crumb',title:'The Sneak',col:'#ff5fa8',skin:'#f8cfae',hair:'#8a3f1d',item:'bag',pony:1,about:'Cuts you off a few blocks ahead.'},
 {name:'Rye',title:'The Flanker',col:'#14b8a6',skin:'#b97c55',hair:'#1d120c',item:'loaf',beard:1,about:'Works with Bruno to box you in.'},
 {name:'Mabel',title:'Grandma Glaze',col:'#ff9f1c',skin:'#ffd9bd',hair:'#dcd6d0',item:'whisk',bun:1,specs:1,about:'Gets close, then loses her nerve.'}
];
const TAUNTS=['Stay off my dough!','Those crullers are MINE.','Back to the station, copper!','You call that a patrol?','Not one sprinkle, officer.'];
const BONUS=[{k:'boston',n:'Boston Cream',p:100},{k:'claw',n:'Bear Claw',p:300},{k:'cruller',n:'French Cruller',p:500},{k:'box',n:'Pink Box',p:700},{k:'golden',n:'Golden Donut',p:1000},{k:'badge',n:'Gold Badge',p:2000}];

/* ---------------- Drawing helpers ---------------- */
let PX=40; // device pixels per drawing unit, used for shadows
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,TAU)}
function ell(c,x,y,rx,ry,a=0){c.beginPath();c.ellipse(x,y,Math.max(.0001,rx),Math.max(.0001,ry),a,0,TAU)}
function fill(c,col){c.fillStyle=col;c.fill()}
function shade(hex,a){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;if(a>=0){r+=(255-r)*a;g+=(255-g)*a;b+=(255-b)*a}else{r*=1+a;g*=1+a;b*=1+a}return`rgb(${r|0},${g|0},${b|0})`}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function shOn(c,blur,ox,oy,col){c.shadowColor=col;c.shadowBlur=blur*PX;c.shadowOffsetX=ox*PX;c.shadowOffsetY=oy*PX}
function shOff(c){c.shadowColor='rgba(0,0,0,0)';c.shadowBlur=0;c.shadowOffsetX=0;c.shadowOffsetY=0}

function drawDonut(c,x,y,r,fr,seed,spr=6){
 const R=rng(seed*7919+13);
 c.save();c.translate(x,y);
 ell(c,r*.12,r*.26,r*1.02,r*.62);fill(c,'rgba(20,10,30,.28)');
 c.beginPath();c.arc(0,0,r,0,TAU);c.arc(0,0,r*.34,0,TAU,true);fill(c,'#d7954f');
 c.beginPath();c.arc(0,r*.06,r*.98,.15,Math.PI-.15);c.lineWidth=r*.1;c.strokeStyle='#b8733a';c.stroke();
 c.beginPath();const n=28;for(let i=0;i<=n;i++){const a=i/n*TAU,q=r*(.82+Math.sin(a*5+seed)*.05+Math.sin(a*11+seed*2)*.025);i?c.lineTo(Math.cos(a)*q,Math.sin(a)*q):c.moveTo(Math.cos(a)*q,Math.sin(a)*q)}
 c.closePath();c.moveTo(r*.44,0);c.arc(0,0,r*.44,0,TAU,true);
 fill(c,fr.f);
 c.lineWidth=r*.1;c.strokeStyle='rgba(255,255,255,.5)';c.beginPath();c.arc(0,0,r*.62,-2.7,-1.7);c.stroke();
 if(fr.s){const cols=fr.sp||SPRINK;for(let i=0;i<spr;i++){const a=R()*TAU,d=r*(.5+R()*.26);c.save();c.translate(Math.cos(a)*d,Math.sin(a)*d);c.rotate(R()*TAU);rr(c,-r*.12,-r*.035,r*.24,r*.07,r*.035);fill(c,cols[(R()*cols.length)|0]);c.restore()}}
 c.restore()}

function drawCoffee(c,x,y,s,t,glow){
 c.save();c.translate(x,y);c.scale(s,s);
 if(glow){const g=c.createRadialGradient(0,0,.05,0,0,.6);g.addColorStop(0,'rgba(255,214,120,.55)');g.addColorStop(1,'rgba(255,214,120,0)');c.fillStyle=g;circ(c,0,0,.6);c.fill()}
 ell(c,.06,.36,.26,.08);fill(c,'rgba(20,10,30,.3)');
 c.beginPath();c.moveTo(-.22,-.18);c.lineTo(.22,-.18);c.lineTo(.16,.34);c.lineTo(-.16,.34);c.closePath();fill(c,'#fffaf0');
 c.beginPath();c.moveTo(-.205,-.02);c.lineTo(.205,-.02);c.lineTo(.185,.17);c.lineTo(-.185,.17);c.closePath();fill(c,'#b5764a');
 c.font='900 .14px Rubik,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillStyle='#fff8ee';c.fillText('JOE',0,.08);
 rr(c,-.26,-.28,.52,.12,.05);fill(c,'#3b2a2a');rr(c,-.18,-.35,.36,.09,.04);fill(c,'#523a3a');
 c.lineWidth=.03;c.strokeStyle='rgba(255,255,255,.6)';c.beginPath();c.moveTo(-.15,-.1);c.lineTo(-.11,.27);c.stroke();
 c.strokeStyle='rgba(255,255,255,.75)';c.lineWidth=.045;c.lineCap='round';
 for(let i=0;i<2;i++){c.beginPath();const ox=(i?.08:-.07);for(let k=0;k<=8;k++){const yy=-.42-k*.05,xx=ox+Math.sin(t*4+k*.8+i*2)*.05;k?c.lineTo(xx,yy):c.moveTo(xx,yy)}c.globalAlpha=.7;c.stroke();c.globalAlpha=1}
 c.restore()}

function legs(c,walk,pant,shoe,hip=.18){const s=Math.sin(walk)*.06;
 for(const [lx,ph] of [[-.1,s],[.1,-s]]){rr(c,lx-.07,hip,.14,.2+ph*.4,.06);fill(c,pant);ell(c,lx+.015,hip+.21+ph*.4,.085,.05);fill(c,shoe)}}
function armLine(c,x0,y0,x1,y1,sleeve,skin,w=.11){c.lineCap='round';c.strokeStyle=sleeve;c.lineWidth=w;c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();circ(c,x1,y1,w*.55);fill(c,skin)}

/* The officer. o: {dx,dy,walk,power,t,dead,chomp} */

 if(G.bonus){G.bonus.t-=dt;if(G.bonus.t<=0)G.bonus=null}
 copStep(dt);for(const b of G.bakers)bakerStep(b,dt);
 const c=G.cop;
 for(const b of G.bakers){if(b.state!=='active')continue;let dx=b.x-c.x;if(dx>COLS/2)dx-=COLS;if(dx<-COLS/2)dx+=COLS;const dy=b.y-c.y;

function update(dt){

 switch(G.phase){
  case 'ready':if(G.pt>2.4){setPhase('play');AU.play(G.fright>0?'power':'patrol')}break;
  case 'play':{let r=dt;while(r>1e-6){const s=Math.min(r,1/120);playStep(s);r-=s;if(G.phase!=='play')break}break}
  case 'catch':if(G.pt>.6)setPhase('play');break;
  case 'dying':if(G.pt>2.1){G.lives--;if(G.lives>0){resetActors();setPhase('ready');AU.sfx('start')}else{setPhase('over');screenOver()}}break;
  case 'clear':if(G.pt>2.6){G.level++;if(G.level%2===1){setPhase('cut');AU.play('title')}else startLevel()}break;
  case 'cut':if(G.pt>6)startLevel();break}
 for(const p of G.parts){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.k==='spr'){p.vy+=7*dt;p.r+=dt*8}else if(p.k==='puff'){p.vx*=.94;p.vy*=.94;p.r+=dt*.35}else if(p.k==='smoke'){p.r+=dt*.25;p.vx+=dt*.3}else if(p.k==='ring'){p.r+=dt*.9}}

const CALM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- HUD ---------------- */

/* ---------------- Layout ---------------- */

 const pad=$('#pad');pad.hidden=false;const padH=pad.offsetHeight;
 let tile=Math.min((W-16)/COLS,(H-hud-foot-12)/ROWS);const showPad=H-hud-foot-12-tile*ROWS>=padH+6||((H-hud-foot-padH-18)/ROWS>=tile*.86&&W<H);

/* ---------------- Input ---------------- */

$('#app').addEventListener('pointermove',e=>{if(!sw||e.pointerId!==sw.id)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;if(Math.hypot(dx,dy)<10)return;
 Math.abs(dx)>Math.abs(dy)?setWant(Math.sign(dx),0):setWant(0,Math.sign(dy));sw.x=e.clientX;sw.y=e.clientY});
addEventListener('pointerup',()=>sw=null);addEventListener('pointercancel',()=>sw=null);
document.querySelectorAll('#pad button').forEach(b=>{const [dx,dy]=b.dataset.d.split(',').map(Number);
 b.addEventListener('pointerdown',e=>{e.preventDefault();AU.init();setWant(dx,dy);held=[dx,dy];b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(x){}});const off=()=>{b.classList.remove('on');if(held&&held[0]===dx&&held[1]===dy)held=null};b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off)});
const KEYS={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};

addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(KEYS[k]){e.preventDefault();AU.init();setWant(...KEYS[k]);held=KEYS[k]}if(k==='Escape'||k==='p')togglePause()});

/* ---------------- Screens ---------------- */
const scr=$('#screen');let heroRAF=0;
function show(html,cls=''){scr.innerHTML=html;scr.className=cls;scr.hidden=false;scr.scrollTop=0;scr.querySelectorAll('canvas[data-p]').forEach(paintPortrait)}

function screenTitle(){G.phase='title';G.paused=false;AU.play('title');

 <canvas class="hero" id="hero"></canvas>

 <div class="menu"><button class="btn go" data-a="start">Start patrol</button>
 <button class="btn" data-a="how">Meet the bakers</button>

function screenHow(){show(`<h2 class="big">The bakery crew</h2>

function screenPause(){show(`<h2 class="big">On break</h2><div class="menu"><button class="btn go" data-a="resume">Back on patrol</button>

 <button class="btn q" data-a="quit">Quit to title</button></div>`,'dim')}
function screenOver(){AU.play('title');const best=G.score>=G.best&&G.score>0;

scr.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;AU.init();AU.sfx('tap');

function heroLoop(sad){const cn=$('#hero');if(!cn)return;const dpr=Math.min(devicePixelRatio||1,3);const W=cn.clientWidth,H=cn.clientHeight;cn.width=W*dpr;cn.height=H*dpr;const c=cn.getContext('2d');
 const conf=[];for(let i=0;i<40;i++)conf.push({x:Math.random(),y:Math.random(),v:.05+Math.random()*.08,r:Math.random()*6,col:SPRINK[i%6]});
 const t0=performance.now();
 const frame=now=>{if(!document.body.contains(cn))return;const t=(now-t0)/1000,u=H*dpr/6;PX=u;

  const aw=W/H*3;
  const glow=c.createRadialGradient(0,-.4,0,0,-.4,2.8);glow.addColorStop(0,'rgba(255,122,181,.45)');glow.addColorStop(1,'rgba(255,122,181,0)');c.fillStyle=glow;c.fillRect(-aw,-3,aw*2,6);

  else{for(let i=0;i<4;i++){const sd=i<2?-1:1,x=sd*(1.55+(i%2)*.95),pk=Math.max(0,Math.sin(t*1.3+i*1.7));c.save();c.translate(x,1.85-pk*.12);c.scale(.95,.95);drawBaker(c,0,0,BAKERS[i],{dx:-sd,dy:0,walk:t*3+i,scared:true,t});c.restore()}

  for(const p of conf){p.y+=p.v/60;if(p.y>1.05)p.y=-.05;c.save();c.translate((p.x-.5)*aw*2,(p.y-.5)*6);c.rotate(p.r+t*3);rr(c,-.08,-.025,.16,.05,.025);fill(c,p.col);c.restore()}

 cancelAnimationFrame(heroRAF);heroRAF=requestAnimationFrame(frame)}

/* ---------------- Loop ---------------- */
