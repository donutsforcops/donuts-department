<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fare Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Bungee&family=Bungee+Shade&display=swap">
<style>
/* Layout: the road fills the screen; HUD is a taxi dash pinned to the edges, thumbs own the bottom corners. */
:root{
  color-scheme:dark;
  --ink:#1b1430; --ink2:#2c2150; --cream:#fff3d6; --cherry:#ee3350; --sun:#ffc531; --cyan:#32e3ff;
  --go:#3ddc6e; --mid:#ffd23f; --far:#ff4d5e; --glass:rgba(27,20,48,.78);
  --display:"Bungee",Impact,"Arial Black",sans-serif;
  --shade:"Bungee Shade","Bungee",Impact,sans-serif;
  --label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--cream);font-family:var(--label);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

#vig{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 54%,var(--vc,rgba(50,227,255,.5)) 100%)}
#vig.low{--vc:rgba(255,50,70,.72);animation:vigp .5s infinite alternate;opacity:1!important}
@keyframes vigp{from{filter:brightness(.72)}to{filter:brightness(1.25)}}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0}
#flash.go{animation:flash .34s ease-out}
@keyframes flash{0%{opacity:.5}100%{opacity:0}}
#wipe{position:absolute;inset:0;pointer-events:none;background:var(--ink);opacity:0}
#wipe.go{animation:wipe .55s ease-out}
@keyframes wipe{0%{opacity:1}100%{opacity:0}}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;font-variant-numeric:tabular-nums}
.top{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px}
.meter{justify-self:start;background:var(--ink);border:3px solid var(--sun);border-radius:6px;padding:2px 10px 3px;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.meter small{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--sun);line-height:1.2}
#cash{font:400 clamp(22px,5.4vmin,38px)/1 var(--display);color:var(--sun)}
#cash.bump{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.22);color:#fff}}
#clockWrap{text-align:center}
#clock{font:400 clamp(38px,10vmin,72px)/.95 var(--display);color:#fff;text-shadow:0 4px 0 var(--ink),0 0 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -2px 0 var(--ink)}
#clock.low{color:var(--far);animation:pulse .5s infinite alternate}
#clock.gain{animation:gain .5s cubic-bezier(.2,1.6,.4,1);color:var(--go)}
@keyframes gain{30%{transform:scale(1.28)}}
@keyframes pulse{to{transform:scale(1.1)}}
#status{font-size:13px;font-weight:700;letter-spacing:.1em;text-shadow:0 1px 2px #000}
#mini{justify-self:end;width:clamp(92px,23vmin,150px);height:clamp(92px,23vmin,150px);border-radius:50%;border:3px solid var(--cream);background:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.4)}
#card{position:absolute;top:calc(clamp(70px,16vmin,110px) + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(340px,calc(100% - clamp(120px,27vmin,180px)));background:var(--glass);border-left:7px solid var(--go);padding:5px 10px 7px;border-radius:0 6px 6px 0}
@media (orientation:portrait){#card{left:10px;transform:none;top:calc(clamp(92px,16vmin,110px) + env(safe-area-inset-top,0px))}}
#card{animation:slidein .22s cubic-bezier(.2,1.5,.5,1)}
@keyframes slidein{from{opacity:0;margin-top:-14px}}
#card.urgent{animation:cardp .32s infinite alternate}
@keyframes cardp{to{background:rgba(120,20,40,.86)}}
#card .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
#tName{font-size:13px;font-weight:600;letter-spacing:.04em;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#tDest{font:400 clamp(14px,3.4vmin,19px)/1.1 var(--display)}
#tDist,#tFare{font-size:clamp(15px,3.4vmin,19px);font-weight:700;white-space:nowrap}
#tFare{color:var(--sun)}
#tBar{height:9px;background:rgba(255,255,255,.18);margin-top:4px;border-radius:2px;overflow:hidden}
#tFill{height:100%;width:100%;background:var(--go);transform-origin:left}
#speedo{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);text-align:center;width:150px;text-shadow:0 2px 0 var(--ink)}
#spd{font:400 clamp(28px,6.6vmin,44px)/1 var(--display)}
#speedo small{font-size:12px;font-weight:700;letter-spacing:.14em;margin-left:3px}
.gauge{height:8px;border:2px solid var(--ink);background:rgba(27,20,48,.6);border-radius:3px;overflow:hidden;margin-top:3px}
.gauge i{display:block;height:100%;width:0;background:var(--cream)}
#boost i{background:var(--cyan)}
#prompt{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);font:400 clamp(22px,6vmin,44px)/1.1 var(--display);color:#fff;text-align:center;text-shadow:0 4px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink);white-space:nowrap}
#floats{position:absolute;top:30%;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.fl{font:400 clamp(17px,4.4vmin,30px)/1.05 var(--display);color:var(--sun);text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink);animation:rise 1.1s ease-out forwards;white-space:nowrap}
.fl.big{font-size:clamp(34px,10vmin,72px);color:#fff}
.fl.cash{font-size:clamp(30px,8.5vmin,60px);color:var(--go)}
.fl.bad{color:var(--far)}
.fl.cool{color:var(--cyan)}
@keyframes rise{0%{transform:scale(.4) rotate(-5deg);opacity:0}15%{transform:scale(1.15) rotate(-2deg);opacity:1}30%{transform:scale(1)}75%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
#bubble{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px));max-width:min(58%,300px);background:var(--cream);color:var(--ink);padding:6px 11px 7px;border-radius:12px 12px 12px 2px;font-size:clamp(15px,3.3vmin,19px);font-weight:600;line-height:1.12;box-shadow:0 3px 0 rgba(0,0,0,.4)}
#bubble{transform-origin:left bottom;animation:pop .2s cubic-bezier(.2,1.7,.5,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}}
#bubble b{display:block;font-size:11px;letter-spacing:.1em;color:var(--cherry);font-weight:700;text-transform:uppercase}
#bubble{bottom:calc(24px + env(safe-area-inset-bottom,0px))}

#radio{pointer-events:auto;position:absolute;left:calc(10px + env(safe-area-inset-left,0px));top:calc(clamp(60px,11.4vmin,74px) + env(safe-area-inset-top,0px));background:var(--glass);padding:3px 8px 4px;border-radius:4px;font:400 11px var(--display);white-space:nowrap;min-height:24px}
#radio span{color:var(--sun)}
@media (orientation:portrait){#coach{top:44%}}
@media (orientation:landscape){#coach{bottom:calc(92px + env(safe-area-inset-bottom,0px))}}
#coach{position:absolute;left:50%;transform:translateX(-50%);max-width:min(84%,420px);text-align:center;background:var(--sun);color:var(--ink);padding:4px 12px 5px;border-radius:5px;font-size:clamp(16px,3.5vmin,20px);font-weight:700;line-height:1.1;box-shadow:0 3px 0 rgba(0,0,0,.35)}
#radioToast{position:absolute;left:50%;top:calc(clamp(70px,16vmin,110px) - 2px + env(safe-area-inset-top,0px));transform:translateX(-50%);font:400 clamp(13px,3vmin,17px) var(--display);color:var(--cyan);text-shadow:0 2px 0 var(--ink);white-space:nowrap;animation:rtoast 2s forwards}
@keyframes rtoast{0%{opacity:0}10%,75%{opacity:1}100%{opacity:0}}

/* Touch */
#touch{position:absolute;inset:0;pointer-events:none}
#steer{position:absolute;left:0;bottom:0;width:52%;height:64%;pointer-events:auto;touch-action:none}
#track{position:absolute;left:calc(20px + env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:148px;height:148px;border-radius:50%;background:radial-gradient(circle,rgba(27,20,48,.25) 0 38%,rgba(27,20,48,.6) 70%);border:3px solid rgba(255,243,214,.55);box-shadow:inset 0 0 0 18px rgba(255,243,214,.05)}
#track i{position:absolute;color:rgba(255,243,214,.6);font:400 13px var(--display);line-height:1;pointer-events:none}
#track .up{left:50%;top:8px;transform:translateX(-50%)}#track .dn{left:50%;bottom:8px;transform:translateX(-50%)}
#track .lf{left:9px;top:50%;transform:translateY(-50%)}#track .rt{right:9px;top:50%;transform:translateY(-50%)}
#knob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fff,var(--cream) 55%,#d8c9a8);box-shadow:0 5px 0 rgba(0,0,0,.35);will-change:transform}
#steer.on #track{border-color:var(--sun)}#steer.on #knob{box-shadow:0 2px 0 rgba(0,0,0,.35),0 0 18px rgba(255,197,49,.6)}
.tb{position:absolute;pointer-events:auto;border-radius:50%;display:grid;place-items:center;font:400 13px var(--display);touch-action:none;border:3px solid rgba(255,243,214,.8);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.tb.on{transform:translateY(3px) scale(.96);filter:brightness(1.35)}
#bBrake{right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(66px + env(safe-area-inset-bottom,0px));width:88px;height:88px;background:var(--cherry);color:#fff;font-size:14px}
#bDrift{right:calc(110px + env(safe-area-inset-right,0px));bottom:calc(58px + env(safe-area-inset-bottom,0px));width:72px;height:72px;background:var(--sun);color:var(--ink)}
#bHorn{right:calc(120px + env(safe-area-inset-right,0px));bottom:calc(142px + env(safe-area-inset-bottom,0px));width:50px;height:50px;background:var(--ink2);color:var(--cream);font-size:10px}
#bBoost{right:calc(34px + env(safe-area-inset-right,0px));bottom:calc(164px + env(safe-area-inset-bottom,0px));width:68px;height:68px;background:var(--cyan);color:var(--ink)}
#pauseBtn{position:absolute;pointer-events:auto;right:calc(10px + env(safe-area-inset-right,0px));top:calc(clamp(92px,23vmin,150px) + 16px + env(safe-area-inset-top,0px));width:46px;height:32px;border-radius:5px;background:var(--glass);font:400 12px var(--display)}

#app.touch #speedo{left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(182px + env(safe-area-inset-bottom,0px));transform:none;width:154px;text-align:left}
#app.touch #bubble{bottom:calc(240px + env(safe-area-inset-bottom,0px))}

/* Panels */
.panel{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;display:flex;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
.sheet{margin:auto;width:100%;max-width:820px;display:grid;gap:12px 28px;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px) and (orientation:landscape){.sheet.two{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:center}}
h1{font:400 clamp(46px,12.5vmin,92px)/.92 var(--shade);margin:0;color:var(--sun);text-shadow:0 5px 0 var(--ink);text-wrap:balance}
.tag{font-size:clamp(18px,4vmin,25px);font-weight:600;margin:6px 0 0;text-shadow:0 2px 2px var(--ink)}
.keys{font-size:14px;line-height:1.25;font-weight:500;margin:0;opacity:.9}
.keys b{color:var(--sun);font-weight:700}
.box{background:var(--ink);border:3px solid var(--cream);padding:10px 12px 12px;border-radius:8px;display:grid;gap:8px;min-width:0}
.lab{font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--sun)}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{padding:7px 3px 8px;border-radius:5px;background:var(--ink2);font:400 clamp(11px,2.7vmin,13px)/1.1 var(--display);min-height:40px}
.opt[aria-pressed=true]{background:var(--sun);color:var(--ink)}
.opt i{display:block;height:6px;border-radius:2px;margin:0 auto 5px;width:60%}
#desc{font-size:16px;line-height:1.2;font-weight:500;min-height:2.4em;margin:0}
#lens{display:flex;gap:6px;align-items:center;font-size:15px;font-weight:600}
#lens .opt{min-height:0;padding:5px 9px;font-size:12px}
.go{font:400 clamp(22px,5.4vmin,32px)/1 var(--display);padding:13px 16px 14px;border-radius:7px;background:var(--cherry);color:#fff;box-shadow:0 5px 0 #8f1630}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #8f1630}
.alt{font:400 14px var(--display);padding:12px;border-radius:7px;background:var(--ink2);border:2px solid var(--cream)}
.btns{display:grid;grid-template-columns:2fr 1fr;gap:8px}
#best{font-size:15px;font-weight:600;margin:0;opacity:.85}
.center{max-width:430px;text-align:center}
.center h2,.shdr h2{font:400 clamp(30px,8vmin,50px)/1 var(--display);margin:0;color:var(--sun);text-shadow:0 4px 0 var(--ink)}
#menu{background:linear-gradient(180deg,rgba(27,20,48,.55),rgba(27,20,48,0) 42%)}
#menu .lead{align-self:start}
@media (orientation:portrait){#menu .sheet{margin:0;min-height:100%;display:flex;flex-direction:column;justify-content:space-between}}
@media (max-height:430px){#desc,#menu .keys{display:none}.opt{min-height:0;padding:5px 3px}.go{padding:8px}.box{gap:5px;padding:7px 10px}}
.vol{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;align-items:center;font-size:16px;font-weight:600;text-align:left}
.vol input{width:100%;accent-color:var(--sun);height:26px;touch-action:none}
#finStamp{display:inline-block}
#rank.stamp{animation:stamp .4s cubic-bezier(.3,1.8,.5,1)}
@keyframes stamp{from{transform:scale(2.2) rotate(-8deg);opacity:0}}
.opt{transition:background .12s}
.opt:hover{filter:brightness(1.2)}
.go:hover{filter:brightness(1.08)}
.alt:hover{background:var(--cherry)}
#over{background:rgba(27,20,48,.72)}
#sum{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;flex-wrap:wrap}
#fin{font:400 clamp(40px,12vmin,76px)/1 var(--display);color:var(--go)}
#rank{font-size:21px;font-weight:700;color:var(--cream)}
#rank small{display:block;font-size:13px;font-weight:600;opacity:.8}
#newbest{color:var(--cyan);font:400 14px var(--display)}
#sheetWrap{max-height:30vh;min-height:64px;overflow-y:auto;touch-action:pan-y;background:var(--cream);color:var(--ink);border-radius:3px;padding:4px 8px}
table{border-collapse:collapse;width:100%;font-size:15px;font-weight:600}
th{font-size:11px;letter-spacing:.1em;text-align:left;position:sticky;top:0;background:var(--cream);padding:3px 4px;border-bottom:2px solid var(--ink)}
td{padding:2px 4px;border-bottom:1px dashed rgba(27,20,48,.3);vertical-align:top}
td:last-child,th:last-child,td:nth-child(3),th:nth-child(3){text-align:right;white-space:nowrap}
#stats{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:16px;font-weight:600}
#stats b{color:var(--sun)}
#err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:var(--ink);font-size:20px}
@media (prefers-reduced-motion:reduce){#vig.low,#card.urgent{animation:none}#clock.low,#cash.bump{animation:none}.fl{animation-duration:1.1s;animation-name:fade}@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}}
</style>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="vig"></div>
  <div id="flash"></div>
  <div id="hud" hidden>
    <button id="radio" aria-label="Change radio station"></button>
    <div id="coach" hidden></div>
    <div class="top">
      <div class="meter"><small>TAKINGS</small><div id="cash">$0</div></div>
      <div id="clockWrap"><div id="clock">3:00</div><div id="status">LEVEL 1</div></div>
      <canvas id="mini" width="300" height="300"></canvas>
    </div>
    <div id="card" hidden>
      <div class="row"><div id="tName"></div><div id="tFare"></div></div>
      <div class="row"><div id="tDest"></div><div id="tDist"></div></div>
      <div id="tBar"><div id="tFill"></div></div>
    </div>
    <div id="floats"></div>
    <div id="prompt" hidden></div>
    <div id="bubble" hidden></div>
    <div id="speedo">
      <span id="spd">0</span><small>MPH</small>
      <div class="gauge" id="speedG"><i></i></div>
      <div class="gauge" id="boost"><i></i></div>
    </div>
  </div>
  <div id="touch" hidden>
    <div id="steer" aria-label="Joystick: push up to drive, tilt to turn, pull down to brake"><div id="track"><i class="up">GO</i><i class="lf">&#9664;</i><i class="rt">&#9654;</i><i class="dn">REV</i><div id="knob"></div></div></div>
    <div class="tb" id="bBrake" data-k="brake">BRAKE</div>
    <div class="tb" id="bHorn" data-k="horn">HONK</div>
    <div class="tb" id="bDrift" data-k="drift">DRIFT</div>
    <div class="tb" id="bBoost" data-k="boost">BOOST</div>
    <button id="pauseBtn" aria-label="Pause">II</button>
  </div>

  <div class="panel" id="menu">
    <div class="sheet two">
      <div class="lead">
        <h1>Fare Game</h1>
        <p class="tag">Pick up. Drop off. Get paid before the clock dies.</p>
      </div>
      <div class="box">
        <div class="lab">SHIFT</div>
        <div class="opts" id="modes"></div>
        <p id="desc"></p>
        <div id="lens" hidden></div>
        <div class="lab">VEHICLE</div>
        <div class="opts three" id="cars"></div>
        <div class="lab">RADIO</div>
        <div class="opts" id="stations"></div>
        <button class="go" id="start">Drive</button>
        <p id="best"></p>
        <p class="keys" id="keys"></p>
      </div>
    </div>
  </div>

  <div class="panel" id="pause" hidden>
    <div class="sheet center">
      <h2>Parked</h2>
      <div class="box">
        <button class="go" id="resume">Resume</button>
        <button class="alt" id="restart">Restart shift</button>
        <label class="vol" for="volM">Music<input id="volM" type="range" min="0" max="100" value="60"></label>
        <label class="vol" for="volS">Effects<input id="volS" type="range" min="0" max="100" value="90"></label>
        <button class="alt" id="radio2">Radio</button>
        <button class="alt" id="quit">Back to menu</button>
      </div>
    </div>
  </div>

  <div class="panel" id="over" hidden>
    <div class="sheet" style="max-width:600px">
      <div class="shdr"><h2 id="overT">Shift over</h2></div>
      <div class="box">
        <div id="sum"><div id="fin">$0</div><div id="rank"></div></div>
        <div id="newbest" hidden>New best for this shift</div>
        <div id="stats"></div>
        <div class="lab">TRIP SHEET</div>
        <div id="sheetWrap"><table><thead><tr><th>Passenger</th><th>To</th><th>Time left</th><th>Paid</th></tr></thead><tbody id="rows"></tbody></table></div>
        <div class="btns"><button class="go" id="again">Drive again</button><button class="alt" id="toMenu">Change shift</button></div>
      </div>
    </div>
  </div>
  <div id="wipe"></div>
  <div id="err" hidden></div>
</div>
<script src="three.min.js"></script>
<script>if(!window.THREE){var e=document.getElementById('err');e.hidden=false;e.textContent='The 3D engine did not load. Check your connection and reload the page.';document.getElementById('menu').hidden=true}</script>
<script>
'use strict';
if(!window.THREE)throw new Error('three missing');
/* ========= CONFIG: every tunable lives here ========= */
const CFG = {
  world: { pitch:70, road:8, hwy:12, boundary:304, cell:5, terrainE:372, texE:320, tex:2048, river:{c:35,top:23,bed:15,depth:4.2,water:-3.4} },
  gravity: 34,
  zones: { pickupR:9.5, pickupSpeed:12, dropR:11, dropSpeed:15 },

function genCity(){
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const t=MAP[r][c];
    const b={r,c,t,x0:line(c)+half(c),x1:line(c+1)-half(c+1),z0:line(r)+half(r),z1:line(r+1)-half(r+1)};
    if(r===3&&c===0)b.garage=true;
    blocks.push(b);
    if(t!=='W')genBlock(b);
  }
  /* bridges at even lines, jump ramps at odd lines */
  const rv=CFG.world.river;
  for(let i=0;i<=8;i++){
    const x=line(i), w=half(i);
    if(i%2===0){
      const hump=(i===0||i===8)?1.4:3;
      addDeck({x0:x-w,x1:x+w,z0:8,z1:62,axis:'z',prof:t=>hump*Math.sin(Math.PI*t),bridge:true,bottom:-1.2});
    } else {
      addDeck({x0:x-6,x1:x+6,z0:8,z1:20,axis:'z',prof:t=>4*t,kicker:true,bottom:-5});
      addDeck({x0:x-6,x1:x+6,z0:50,z1:62,axis:'z',prof:t=>4*(1-t),kicker:true,bottom:-5});
    }
  }
  /* boost pads on the ring highway */
  for(const t of[-140,140]){boostPads.push({x:line(0),z:t},{x:line(8),z:t},{x:t,z:line(0)},{x:t,z:line(8)})}
  /* landmarks */
  LANDMARKS.forEach(([name,r,c])=>{
    const b=blocks.find(q=>q.r===r&&q.c===c), x=(b.x0+b.x1)/2, side=r<=3?-1:1, z=side<0?b.z0+2.6:b.z1-2.6;
    landmarks.push({name,x,z,y:terrain(x,z),nz:side});
  });
  buildGeometry();
}

function buildDeckMesh(m,d,n,a,bc,side){
  const y0=d.bottom;
  for(let i=0;i<n;i++){
    const t0=i/n,t1=(i+1)/n,ha=d.prof(t0),hb=d.prof(t1),col=i%2?bc:a;
    if(d.axis==='z'){
      const za=lerp(d.z0,d.z1,t0),zb=lerp(d.z0,d.z1,t1);
      m.quad([d.x0,hb,zb],[d.x1,hb,zb],[d.x1,ha,za],[d.x0,ha,za],col);
      m.quad([d.x0,y0,za],[d.x0,y0,zb],[d.x0,hb,zb],[d.x0,ha,za],side);
      m.quad([d.x1,y0,zb],[d.x1,y0,za],[d.x1,ha,za],[d.x1,hb,zb],side);
    } else {
      const xa=lerp(d.x0,d.x1,t0),xb=lerp(d.x0,d.x1,t1);
      m.quad([xa,ha,d.z1],[xb,hb,d.z1],[xb,hb,d.z0],[xa,ha,d.z0],col);
      m.quad([xa,y0,d.z1],[xb,y0,d.z1],[xb,hb,d.z1],[xa,ha,d.z1],side);
      m.quad([xb,y0,d.z0],[xa,y0,d.z0],[xa,ha,d.z0],[xb,hb,d.z0],side);
    }
  }
  const s=d.prof(0),e=d.prof(1);
  if(d.axis==='z'){
    if(s-y0>.3)m.quad([d.x1,y0,d.z0],[d.x0,y0,d.z0],[d.x0,s,d.z0],[d.x1,s,d.z0],side);
    if(e-y0>.3)m.quad([d.x0,y0,d.z1],[d.x1,y0,d.z1],[d.x1,e,d.z1],[d.x0,e,d.z1],side);
  } else {
    if(s-y0>.3)m.quad([d.x0,y0,d.z0],[d.x0,y0,d.z1],[d.x0,s,d.z1],[d.x0,s,d.z0],side);
    if(e-y0>.3)m.quad([d.x1,y0,d.z1],[d.x1,y0,d.z0],[d.x1,e,d.z0],[d.x1,e,d.z1],side);
  }
}

function buildGeometry(){
  /* terrain */
  const g=new THREE.PlaneGeometry(TE*2,TE*2,TN,TN);g.rotateX(-Math.PI/2);
  const pa=g.attributes.position, ua=g.attributes.uv, TX=CFG.world.texE;

  g.computeVertexNormals();
  const tex=paintGround();
  tex.anisotropy=renderer.capabilities.getMaxAnisotropy();tex.wrapS=tex.wrapT=THREE.ClampToEdgeWrapping;

  ripple.wrapS=ripple.wrapT=THREE.RepeatWrapping;ripple.repeat.set(30,3);
  const water=new THREE.Mesh(new THREE.PlaneGeometry(TE*2,rv.top*2),new THREE.MeshLambertMaterial({color:0x35b9c9,map:ripple,transparent:true,opacity:.82}));
  water.rotation.x=-Math.PI/2;water.position.set(0,rv.water,rv.c);scene.add(water);world.water=ripple;
  /* decks */
  const dm=new Mesher();
  decks.forEach(d=>{
    if(d.bridge){
      buildDeckMesh(dm,d,16,0x3b3852,0x3b3852,0xb7a98f);
      const rail=(x0,x1)=>{const o={...d,x0,x1,prof:t=>d.prof(t)+.8,bottom:d.prof(0)-.3};buildDeckMesh(dm,o,16,0xe9dcc2,0xe9dcc2,0xd8c6a8)};
      rail(d.x0-.7,d.x0);rail(d.x1,d.x1+.7);
      for(const px of[d.x0+1,d.x1-1])dm.box(px,-4.3,35,2,4.2+d.prof(.5)-.5,3,0xb7a98f,{noTop:true});
    } else if(d.garage){
      buildDeckMesh(dm,d,22,0x6d6786,0x65607e,0x8d86a8);
    } else buildDeckMesh(dm,d,6,0xffc531,0x2a2440,0x4a3f62);
  });
  scene.add(new THREE.Mesh(dm.geometry(),matPlain));
  /* road paint and curbs as geometry so they stay crisp up close */
  buildMarkings();
  /* ads */
  const atlas=canvasTex(1024,1024,(c,w,h)=>{ADS.forEach(([t,bg,fg],i)=>{const x=(i%2)*w/2,y=Math.floor(i/2)*h/4,W=w/2,H=h/4;
    c.fillStyle=bg;c.fillRect(x,y,W,H);c.strokeStyle=fg;c.lineWidth=10;c.strokeRect(x+14,y+14,W-28,H-28);c.fillStyle=fg;c.textAlign='center';c.textBaseline='middle';c.font='400 70px Bungee,Impact,sans-serif';
    const ws=t.split(' ');if(ws.length>2){c.fillText(ws.slice(0,2).join(' '),x+W/2,y+H*.36,W-60);c.fillText(ws.slice(2).join(' '),x+W/2,y+H*.68,W-60)}else{c.font='400 84px Bungee,Impact,sans-serif';c.fillText(t,x+W/2,y+H/2+4,W-60)}})});
  atlas.anisotropy=4;world.atlas=atlas;
  scene.add(new THREE.Mesh(adMesh.geometry(),new THREE.MeshBasicMaterial({map:atlas})));
  /* signal poles, boundary barrier */
  const bm=new Mesher(), B=CFG.world.boundary;
  for(let s=-B;s<B;s+=16){for(const v of[-B,B]){
    if(Math.abs(s-35)>26||true){const y=terrain(s+8,v)-.4,y2=terrain(v,s+8)-.4,col=(Math.round(s/16)%2)?0xee3350:0xfff3d6;
      bm.box(s+8,y,v,16,1.9,1,col);bm.box(v,y2,s+8,1,1.9,16,col)}

  scene.add(new THREE.Mesh(bm.geometry(),matPlain));
  /* chunks */
  chunks.forEach(c=>{scene.add(new THREE.Mesh(c.plain.geometry(),matPlain));scene.add(new THREE.Mesh(c.win.geometry(),matWin))});
  chunks.clear();
  /* landmark signs */
  landmarks.forEach(l=>{
    const t=canvasTex(320,80,(c,w,h)=>{c.fillStyle='#1b1430';c.fillRect(0,0,w,h);c.strokeStyle='#ffc531';c.lineWidth=6;c.strokeRect(5,5,w-10,h-10);c.fillStyle='#fff3d6';c.font='700 38px "Barlow Condensed",Arial Narrow,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(l.name.toUpperCase(),w/2,h/2+1,w-24)});

function buildMarkings(){
  const m=new Mesher(),WHITE=0xfaf2dc,YEL=0xffc531,y=(x,z)=>surfaceAt(x,z)+.085;
  const f=(x0,z0,x1,z1,col)=>m.quad([x0,y(x0,z1),z1],[x1,y(x1,z1),z1],[x1,y(x1,z0),z0],[x0,y(x0,z0),z0],col);
  for(let i=0;i<=8;i++){const a=line(i),ring=i===0||i===8,hw=half(i);
    for(let j=0;j<8;j++){
      const s=line(j)+half(j)+1,e=line(j+1)-half(j+1)-1, gap=j===4&&i%2===1;
      for(let q=s;q<e-1;q+=7){const qe=Math.min(q+3.4,e);
        for(const off of ring?[-6,6]:[0]){
          if(!gap)f(a+off-.13,q,a+off+.13,qe,WHITE);
          if(!(i===0||i===8)||true)f(q,a+off-.13,qe,a+off+.13,WHITE);
        }
      }
      if(ring)for(let q=s;q<e;q+=8){const qe=Math.min(q+8,e);
        f(a-.28,q,a+.28,qe,YEL);f(q,a-.28,qe,a+.28,YEL);
        for(const o of[-hw+.7,hw-.7]){f(a+o-.11,q,a+o+.11,qe,WHITE);f(q,a+o-.11,qe,a+o+.11,WHITE)}
      }
    }
  }
  for(let i=0;i<=8;i++)for(let j=0;j<=8;j++){
    const x=line(i),z=line(j),hx=half(i),hz=half(j),north=j>0&&!(j===5&&i%2),south=j<8&&!(j===4&&i%2),west=i>0,east=i<8;
    for(let s=-hx+1;s<hx-1;s+=2.4){if(north)f(x+s,z-hz-2.6,x+s+1.1,z-hz-.6,WHITE);if(south)f(x+s,z+hz+.6,x+s+1.1,z+hz+2.6,WHITE)}
    for(let s=-hz+1;s<hz-1;s+=2.4){if(west)f(x-hx-2.6,z+s,x-hx-.6,z+s+1.1,WHITE);if(east)f(x+hx+.6,z+s,x+hx+2.6,z+s+1.1,WHITE)}
    if(i>0&&i<8&&j>0&&j<8){
      if(north)f(x-hx+.5,z-hz-3.5,x-.5,z-hz-3.1,WHITE);if(south)f(x+.5,z+hz+3.1,x+hx-.5,z+hz+3.5,WHITE);
      f(x-hx-3.5,z+.5,x-hx-3.1,z+hz-.5,WHITE);f(x+hx+3.1,z-hz+.5,x+hx+3.5,z-.5,WHITE);
    }
  }
  /* curbs with gutter shade, gaps left at alley mouths */
  const CURB=0xf4ead6,GUT=0x2c2a40;
  const strip=(x0,z0,x1,z1,horiz,nrm,gap)=>{
    const L=horiz?x1-x0:z1-z0;
    for(let q=0;q<L;q+=6){const a=q,b=Math.min(q+6,L),ca=horiz?x0+a:z0+a,cb=horiz?x0+b:z0+b;
      if(gap!==null&&cb>gap-3.9&&ca<gap+3.9)continue;
      if(horiz){const z=z0;f(ca,Math.min(z,z-nrm*.5),cb,Math.max(z,z-nrm*.5),CURB);f(ca,Math.min(z,z+nrm*.5),cb,Math.max(z,z+nrm*.5),GUT)}
      else{const x=x0;f(Math.min(x,x-nrm*.5),ca,Math.max(x,x-nrm*.5),cb,CURB);f(Math.min(x,x+nrm*.5),ca,Math.max(x,x+nrm*.5),cb,GUT)}
    }
  };
  blocks.forEach(b=>{ if(b.t==='W')return;
    const cx=(b.x0+b.x1)/2,cz=(b.z0+b.z1)/2,ns=(b.alley==='ns'||b.alley==='both')?cx:null,ew=(b.alley==='ew'||b.alley==='both')?cz:null;
    strip(b.x0,b.z0,b.x1,b.z0,true,-1,ns);strip(b.x0,b.z1,b.x1,b.z1,true,1,ns);
    strip(b.x0,b.z0,b.x0,b.z1,false,-1,ew);strip(b.x1,b.z0,b.x1,b.z1,false,1,ew);
  });
  const g=m.geometry(),mt=new THREE.MeshLambertMaterial({vertexColors:true,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});
  scene.add(new THREE.Mesh(g,mt));
}

/* ========= Ground painter: one texture, also used for the minimap ========= */
const world={};
function paintGround(){
  const S=CFG.world.tex, E=CFG.world.texE, k=S/(2*E), cv=document.createElement('canvas');cv.width=cv.height=S;
  const c=cv.getContext('2d'), X=x=>(x+E)*k, rect=(x0,z0,x1,z1,col)=>{c.fillStyle=col;c.fillRect(X(x0),X(z0),(x1-x0)*k,(z1-z0)*k)};
  const GRASS='#86ad56',WALK='#d9cdbd',ASPH='#3b3852',LINE='#f6ecd2',YEL='#ffc531',LOT='#514d68',ALLEY='#5b5570',PLAZA='#e2c7a4';
  rect(-E,-E,E,E,GRASS);
  for(let i=0;i<1800;i++){c.fillStyle=wr()<.5?'rgba(70,110,50,.28)':'rgba(170,200,100,.24)';c.fillRect(wr()*S,wr()*S,wn(4,14),wn(2,5))}
  blocks.forEach(b=>{
    if(b.t==='W')return;
    const {x0,x1,z0,z1,t}=b,cx=(x0+x1)/2,cz=(z0+z1)/2,m=4;
    rect(x0,z0,x1,z1,WALK);
    c.fillStyle='rgba(90,75,90,.22)';
    for(let s=x0;s<x1;s+=3)c.fillRect(X(s),X(z0),1,4*k),c.fillRect(X(s),X(z1)-4*k,1,4*k);
    for(let s=z0;s<z1;s+=3)c.fillRect(X(x0),X(s),4*k,1),c.fillRect(X(x1)-4*k,X(s),4*k,1);
    if(t==='D'||t==='M'){rect(x0+m,z0+m,x1-m,z1-m,ALLEY);
      c.fillStyle='rgba(255,197,49,.5)';
      if(b.alley!=='ew')for(let s=z0;s<z1;s+=7)c.fillRect(X(cx)-1,X(s),2,3*k);
      if(b.alley!=='ns')for(let s=x0;s<x1;s+=7)c.fillRect(X(s),X(cz)-1,3*k,2);
      if(b.alley==='ns'||b.alley==='both'){rect(cx-3.5,z0,cx+3.5,z0+m,ALLEY);rect(cx-3.5,z1-m,cx+3.5,z1,ALLEY)}
      if(b.alley==='ew'||b.alley==='both'){rect(x0,cz-3.5,x0+m,cz+3.5,ALLEY);rect(x1-m,cz-3.5,x1,cz+3.5,ALLEY)}
    } else if(t==='H'){rect(x0+m,z0+m,x1-m,z1-m,'#8ebc5c');
      for(const sx of[-1,1])for(const sz of[-1,1]){const dw=(x1-x0)*.27;rect(cx+sx*dw-2,sz<0?z0:cz+sz*6,cx+sx*dw+2,sz<0?cz-6:z1,'#b9afa0')}
    } else if(t==='P'){rect(x0+m,z0+m,x1-m,z1-m,'#75b257');rect(cx-2.2,z0,cx+2.2,z1,'#e6d3a6');rect(x0,cz-2.2,x1,cz+2.2,'#e6d3a6');
      c.fillStyle='#e6d3a6';c.beginPath();c.arc(X(cx),X(cz),6*k,0,TAU);c.fill();
    } else if(t==='L'){rect(x0+2,z0+2,x1-2,z1-2,LOT);c.fillStyle=LINE;
      for(const zz of[z0+6,z1-14])for(let s=x0+4;s<x1-4;s+=4.4)c.fillRect(X(s),X(zz),2,8*k);
      c.fillStyle=YEL;c.fillRect(X(x0+2),X(cz)-1,(x1-x0-4)*k,2);
    } else if(t==='A'){rect(x0+1,z0+1,x1-1,z1-1,PLAZA);c.fillStyle='rgba(130,80,70,.25)';
      for(let i=0,s=x0+1;s<x1;s+=5,i++)for(let j=0,q=z0+1;q<z1;q+=5,j++)if((i+j)%2)c.fillRect(X(s),X(q),5*k,5*k);
    }
  });
  /* river */
  const rv=CFG.world.river;

function updateTraffic(dt,target,running){

      for(const o of traffic){if(o===c||!o.on)continue;const rx=o.x-c.x,rz=o.z-c.z;if(Math.abs(rx)>18||Math.abs(rz)>18)continue;const al=rx*fx+rz*fz,lt=Math.abs(rx*fz-rz*fx);if(al>0&&al<16&&lt<2.6)tg=Math.min(tg,Math.max(0,(al-7)*1.5))}
      {const rx=car.x-c.x,rz=car.z-c.z,al=rx*fx+rz*fz,lt=Math.abs(rx*fz-rz*fx);if(al>0&&al<20&&lt<3)tg=Math.min(tg,Math.max(0,(al-6)*1.4))}
      c.speed=damp(c.speed,tg,tg<c.speed?5:1.6,dt);
      if(c.speed<.5){c.stuck+=dt;if(c.stuck>14&&d>60){hideCar(c);sh.setMatrixAt(c.idx+1,ZERO);continue}}else c.stuck=0;

          const e=opts.length?pick(opts):[l.from[0],l.from[1]],nl=lane(l.to[0],l.to[1],e[0],e[1]);

function initPeds(){

    const p={i,dive:0,vx:0,vz:0,hop:0,scared:0,sp:rnd(1.2,2.1),phase:Math.random()*6};

function assignPed(p,b){
  const m=2.2;p.wp=[[b.x0+m,b.z0+m],[b.x1-m,b.z0+m],[b.x1-m,b.z1-m],[b.x0+m,b.z1-m]];p.w=Math.floor(Math.random()*4);p.dir=Math.random()<.5?1:3;
  const a=p.wp[p.w],c=p.wp[(p.w+p.dir)%4],t=Math.random();p.x=lerp(a[0],c[0],t);p.z=lerp(a[1],c[1],t);p.w=(p.w+p.dir)%4;p.a=0;p.b=b;

let voiceCool=0;
function updatePeds(dt){

    const dc=Math.hypot(p.x-car.x,p.z-car.z);
    if(dc>230){const near=wb.filter(b=>{const cx=(b.x0+b.x1)/2,cz=(b.z0+b.z1)/2,d=Math.hypot(cx-car.x,cz-car.z);return d<170&&d>70});if(near.length)assignPed(p,pick(near));
      world3.pb.setMatrixAt(p.i,ZERO);world3.ph.setMatrixAt(p.i,ZERO);continue}

      const rx=p.x-car.x,rz=p.z-car.z,al=rx*fx+rz*fz,lt=rx*fz-rz*fx;

function initTouch(){
  /* Joystick: push up to drive, tilt left/right to turn (up-left / up-right to turn while driving),

  const pad=$('steer'),track=$('track'),knob=$('knob');let id=null,cx=0,cy=0;const R=58,HALF=74;
  const curve=(v,dz)=>{const a=Math.abs(v);return a<dz?0:Math.sign(v)*Math.pow((a-dz)/(1-dz),1.4)};
  const set=(dx,dy)=>{
    const len=Math.hypot(dx,dy);if(len>R){dx*=R/len;dy*=R/len}
    knob.style.transform=`translate(${dx}px,${dy}px)`;
    const nx=dx/R,ny=dy/R,fwd=-ny;
    input.touchSteer=curve(nx,.12);
    let gas=fwd>.12?Math.min(1,(fwd-.12)/.6):0;
    if(Math.abs(nx)>.45&&fwd>-.25)gas=Math.max(gas,.55);           // tilting sideways still rolls you forward

    const on=v=>{if(v&&b.dataset.k==='horn'&&!input.tHorn)honk();input[prop]=v;b.classList.toggle('on',v)};

  /* later levels lean toward longer, river-crossing trips */
  const wt={go:Math.max(1,5-G.level),mid:3+G.level*.3,far:1+G.level*.9},opts=[];
  landmarks.forEach(l=>{const d=manhattan(spot,l);if(d<70)return;const cat=catOf(d);let w=wt[cat];if(G.level>=2&&(spot.z<35)!==(l.z<35))w*=1.5;opts.push({l,d,cat,w})});

function fillPassengers(){let w=passengers.filter(p=>p.state==='wait').length;while(w<CFG.passengers){if(!spawnPassenger())break;w++}}

function updatePassengers(dt){
  let hail=null,hailD=1e9;
  for(let i=passengers.length-1;i>=0;i--){const p=passengers[i];p.t+=dt;
    if(p.state==='wait'){
      if(Math.hypot(p.x-car.x,p.z-car.z)>190&&!G.trip&&Math.random()<.002){removePassenger(p);continue}
      p.arm.rotation.x=-2.5+Math.sin(p.t*9)*.5;p.g.position.y=p.y+Math.abs(Math.sin(p.t*4.5))*.28;
      const d=Math.hypot(p.x-car.x,p.z-car.z);
      p.g.rotation.y=damp(p.g.rotation.y,Math.atan2(-(car.x-p.x),-(car.z-p.z)),3,dt);
      p.chev.position.y=p.y+5+Math.sin(p.t*3)*.5;p.chev.rotation.y+=dt*2;
      {const pu=CFG.zones.pickupR*(1+Math.sin(p.t*5)*.035);p.ring.scale.set(pu,1,pu);p.beam.material.opacity=.3+Math.sin(G.time*3)*.06}
      const vis=!G.trip;p.beam.visible=vis;p.chev.visible=vis;p.ring.visible=vis||d<90;p.disc.visible=vis;
      if(!G.trip&&d<hailD){hail=p;hailD=d}
    } else if(p.state==='boarding'){
      const q=clamp(p.t/.38,0,1);
      p.g.position.set(lerp(p.x,car.x,q),lerp(p.y,car.y,q)+Math.sin(q*Math.PI)*2.2,lerp(p.z,car.z,q));
      p.g.scale.setScalar(1.35*(1-q*.75));p.g.rotation.y+=dt*10;p.arm.rotation.x=-3;
      if(q>=1){p.state='aboard';p.g.visible=false;carHead.visible=true;carHead.material.color.set(p.ch.look.skin)}
    } else if(p.state==='exit'||p.state==='bail'){
      const q=clamp(p.t/.5,0,1);
      if(q<1){p.g.position.set(lerp(p.x0,p.x,q),lerp(car.y,p.y,q)+Math.sin(q*Math.PI)*2.6,lerp(p.z0,p.z,q));p.g.rotation.y+=dt*12}
      else{
        p.g.position.set(p.x,p.y+Math.abs(Math.sin(p.t*8))*.6,p.z);p.arm.rotation.x=-2.8+Math.sin(p.t*14)*.5;
        p.g.rotation.y=damp(p.g.rotation.y,Math.atan2(-(car.x-p.x),-(car.z-p.z)),6,dt);
        if(p.t>3.2)p.g.scale.setScalar(1.35*Math.max(0,1-(p.t-3.2)*3));
      }
      if(p.t>3.6)removePassenger(p);
    }
  }
  return {hail,hailD};
}

/* ========= Driving physics ========= */
function stepCar(dt){
  const s=car.spec, a0=car.a, fx=-Math.sin(a0), fz=-Math.cos(a0), rx=Math.cos(a0), rz=-Math.sin(a0);
  let vf=car.vx*fx+car.vz*fz, vl=car.vx*rx+car.vz*rz;
  car.steer=damp(car.steer,input.steerT,input.touch?(input.steerT?7.5:13):11,dt);
  const boostWant=input.boost&&car.fuel>0&&input.brake<.5;
  if(boostWant&&!car.boostWas&&G.state==='play')Snd.boostOn();car.boostWas=boostWant;
  car.boosting=boostWant||car.pad>0;
  if(boostWant)car.fuel=Math.max(0,car.fuel-34*dt);else car.fuel=Math.min(100,car.fuel+3.5*dt);
  car.pad=Math.max(0,car.pad-dt);
  const water=car.grounded&&car.y<-2.9; if(water&&!car.water&&Math.hypot(car.vx,car.vz)>5&&G.state==='play'){Snd.splash(.7);react('water',true);for(let i=0;i<24;i++)spawnP(car.x+rnd(-2,2),CFG.world.river.water+.2,car.z+rnd(-2,2),rnd(-7,7),rnd(5,15),rnd(-7,7),rnd(.25,.5),pick([0xcff6ff,0x9fe9ff,0xffffff]),rnd(.5,1),24)} car.water=water;
  if(car.grounded){
    let maxS=s.maxSpeed*(car.boosting?1.35:1);
    if(water)maxS=Math.min(maxS,15);
    if(input.gas>0){
      if(vf<-1)vf+=58*dt;
      else if(vf<maxS)vf+=s.accel*input.gas*(1-Math.max(vf,0)/maxS*.72)*(car.boosting?1.9:1)*dt;
    }
    if(input.brake>0){if(vf>1)vf-=66*dt;else vf=Math.max(vf-s.accel*.7*dt,-17)}
    if(vf>maxS)vf=damp(vf,maxS,water?3.2:1.4,dt);
    vf*=Math.exp(-(input.gas?.05:.38)*dt);
    if(input.drift)vf*=Math.exp(-.55*dt);
    const sp=Math.abs(vf),auth=clamp(sp/6,0,1),fall=1-.44*clamp(sp/s.maxSpeed,0,1.2);
    const rate=s.steer*car.steer*auth*fall*(input.drift?1.6:1)*(vf<-.5?-1:1);
    car.a-=rate*dt;
    const before=Math.hypot(vf,vl);
    const grip=input.drift?s.drift:(Math.abs(vl)>7?s.grip*.45:s.grip);
    vl*=Math.exp(-grip*dt);
    const after=Math.hypot(vf,vl);
    if(after>.01&&vf>0){const k=lerp(1,before/after,.72);vf*=k;vl*=k}
    /* slope pull */
    const e=2,gx=(surfaceAt(car.x+e,car.z,car.y)-surfaceAt(car.x-e,car.z,car.y))/(2*e),gz=(surfaceAt(car.x,car.z+e,car.y)-surfaceAt(car.x,car.z-e,car.y))/(2*e);
    car.vx=fx*vf+rx*vl-gx*17*dt;car.vz=fz*vf+rz*vl-gz*17*dt;
    /* tricks */
    if(Math.abs(vl)>5&&sp>12){car.driftT+=dt}
    else if(Math.abs(vl)<3){if(car.driftT>.9&&G.state==='play')trick('DRIFT',Math.round(car.driftT*CFG.fares.driftPerSec));car.driftT=0}
    car.slip=(Math.abs(vl)>4&&sp>9)?Math.abs(vl)/16:(input.brake&&vf>10?.35:0);
    if(car.slip>.2&&!water){
      const rb=-Math.sin(car.a),rc=-Math.cos(car.a),Rx=Math.cos(car.a),Rz=-Math.sin(car.a);
      for(const sd of[-1,1]){const wx=car.x-rb*1.45+Rx*sd,wz=car.z-rc*1.45+Rz*sd;
        if(Math.random()<.55)addSkid(wx,car.y,wz,car.a);
        if(Math.random()<.2)spawnP(wx,car.y+.2,wz,rnd(-1,1),rnd(.5,1.5),rnd(-1,1),.26,0xf6efe6,.5,-1,1.5)}
    }
    if(water&&sp>4&&Math.random()<.7)spawnP(car.x+rnd(-1,1),CFG.world.river.water+.2,car.z+rnd(-1,1),rnd(-3,3)+car.vx*.2,rnd(3,8),rnd(-3,3)+car.vz*.2,.32,0xcff6ff,.55,22);
  } else {
    car.a-=car.steer*1.5*dt;
    car.slip=0;
    car.vx*=Math.exp(-.06*dt);car.vz*=Math.exp(-.06*dt);
  }
  if(car.boosting&&Math.random()<.7){spawnP(car.x-fx*2.5+rnd(-.4,.4),car.y+.6,car.z-fz*2.5+rnd(-.4,.4),-fx*8,rnd(0,2),-fz*8,.36,pick([0x32e3ff,0xffffff,0xffc531]),.32,0)}
  /* move */
  let nx=car.x+car.vx*dt,nz=car.z+car.vz*dt;
  const B=CFG.world.boundary-2;
  if(Math.abs(nx)>B){nx=clamp(nx,-B,B);if(Math.abs(car.vx)>12)bumpFx(Math.abs(car.vx));car.vx*=-.35}
  if(Math.abs(nz)>B){nz=clamp(nz,-B,B);if(Math.abs(car.vz)>12)bumpFx(Math.abs(car.vz));car.vz*=-.35}
  /* walls */
  const R=1.9, list=collidersNear(nx,nz);
  for(let i=0;i<list.length;i++){const c=list[i];
    if(car.y>=c.top-.4)continue;
    const qx=clamp(nx,c.x0,c.x1),qz=clamp(nz,c.z0,c.z1);let dx=nx-qx,dz=nz-qz,d=Math.hypot(dx,dz);
    if(d>=R)continue;
    if(d<.0001){const l=nx-c.x0,r=c.x1-nx,u=nz-c.z0,w=c.z1-nz,m=Math.min(l,r,u,w);if(m===l){dx=-1;dz=0;nx=c.x0-R}else if(m===r){dx=1;dz=0;nx=c.x1+R}else if(m===u){dx=0;dz=-1;nz=c.z0-R}else{dx=0;dz=1;nz=c.z1+R}d=1}
    else{dx/=d;dz/=d;nx=qx+dx*R;nz=qz+dz*R}
    {const tan=Math.abs(car.vx*-dz+car.vz*dx);if(tan>10&&G.state==='play'){G.scrape=.08;if(Math.random()<.5)spawnP(qx,car.y+rnd(.4,1.2),qz,rnd(-3,3)-car.vx*.1,rnd(1,6),rnd(-3,3)-car.vz*.1,rnd(.1,.2),pick([0xffc531,0xfff3d6,0xff7a2d]),.3,18)}}
    const vn=car.vx*dx+car.vz*dz;
    if(vn<0){
      const imp=-vn;car.vx-=dx*vn*1.25;car.vz-=dz*vn*1.25;
      /* forgiving: scrub a little speed, turn along the wall */
      car.vx*=.985;car.vz*=.985;
      const tx=-dz,tz=dx,sgn=car.vx*tx+car.vz*tz>=0?1:-1,tgt=Math.atan2(-tx*sgn,-tz*sgn);
      let df=tgt-car.a;df=Math.atan2(Math.sin(df),Math.cos(df));
      if(Math.abs(df)<1.3)car.a+=df*Math.min(1,dt*6);
      if(imp>9)bumpFx(imp);
    }
  }
  /* vertical */
  const h=surfaceAt(nx,nz,car.y);
  if(car.grounded){
    const pred=car.y+car.vy*dt-CFG.gravity*dt*dt;
    if(pred>h+.14){car.grounded=false;car.air=0;car.y=pred;car.vy-=CFG.gravity*dt}
    else{const nv=clamp((h-car.y)/dt,-30,30);car.vy=damp(car.vy,nv,28,dt);car.y=h}
  } else {
    car.air+=dt;car.vy-=CFG.gravity*dt;car.y+=car.vy*dt;
    if(car.y<=h){
      const imp=-car.vy;car.y=h;car.vy=0;car.grounded=true;
      if(imp>5){car.squash=clamp(imp/26,.2,.6);Snd.land(clamp(imp/30,0,1));car.shake=Math.max(car.shake,clamp(imp/60,0,.5));for(let i=0;i<8;i++)spawnP(nx+rnd(-1.4,1.4),h+.2,nz+rnd(-1.4,1.4),rnd(-3,3),rnd(1,3),rnd(-3,3),.3,0xe9e0d0,.45,-1,1.5)}
      if(car.air>.55&&G.state==='play')trick(car.air>1.1?'BIG AIR':'AIR',Math.round(car.air*CFG.fares.jumpPerSec));
      car.air=0;
    }
  }
  car.x=nx;car.z=nz;
  /* boost pads */
  if(car.grounded)for(const p of boostPads)if(Math.abs(p.x-nx)<11&&Math.abs(p.z-nz)<11){if(car.pad<=0){Snd.whoosh();if(G.state==='play')float('BOOST','cool')}car.pad=1.5;break}
  /* props */
  const speed=Math.hypot(car.vx,car.vz),near=propHash.get(Math.floor(nx/16)*4096+Math.floor(nz/16));
  for(let ox=-1;ox<=1;ox++)for(let oz=-1;oz<=1;oz++){
    const a=propHash.get((Math.floor(nx/16)+ox)*4096+Math.floor(nz/16)+oz);if(!a)continue;
    for(const o of a){if(!o.alive)continue;const D=PROP[o.type],d=Math.hypot(o.x-nx,o.z-nz);
      if(d<D.r+1.5&&car.y<o.y+3&&speed>2){const ms=s.mass>1.5?Math.sqrt(D.drag):D.drag;hitProp(o,car.vx,car.vz,speed);car.vx*=ms;car.vz*=ms;if(o.type==='parked'||o.type==='tree'){car.shake=Math.max(car.shake,.25);Snd.crash(.4)}}
    }
  }
  void near;
  /* traffic */
  for(const c of traffic){if(!c.on)continue;
    const dx=nx-c.x,dz=nz-c.z,d=Math.hypot(dx,dz),rr=c.r+1.5;
    if(d<rr&&Math.abs(car.y-c.y)<3&&car.hitCool<=0){

      car.hitCool=.25;c.hitT=1.5;c.nm=false;
      const ms=s.mass;
      c.bump={vx:car.vx*.75*ms-n1*6,vz:car.vz*.75*ms-n2*6,vy:3+speed*.18*ms,spin:rnd(-5,5),t:0};
      const keep=lerp(.62,.9,clamp((ms-.8)/1.1,0,1));car.vx*=keep;car.vz*=keep;car.vx+=n1*4;car.vz+=n2*4;
      car.x=nx=c.x+n1*rr;car.z=nz=c.z+n2*rr;
      if(rel>8){bumpFx(rel);burst(c.x,c.y+1,c.z,10,[0xffc531,0xffffff,c.color],9);if(Math.random()<.7)setTimeout(()=>Snd.honk(c.x,c.z),180)}
    }
    if(!c.bump&&speed>20&&c.hitT<=0){
      if(d<5.8)c.nm=true;
      else if(c.nm&&d>7.2){c.nm=false;if(G.state==='play'){trick('NEAR MISS',CFG.fares.near);Snd.pass(c);if(Math.random()<.6)Snd.honk(c.x,c.z)}}
    } else if(c.nm&&d>7.2)c.nm=false;
    if(c.hitT>0)c.hitT-=dt;
  }
  car.hitCool=Math.max(0,car.hitCool-dt);
  /* speed trick */
  if(G.state==='play'){
    if(speed>s.maxSpeed*.86&&car.grounded){G.flatT+=dt;if(G.flatT>3){G.flatT=0;trick('FLAT OUT',CFG.fares.flatOut)}}else G.flatT=0;
  }

/* ========= Camera ========= */
const cam={yaw:0,x:0,y:10,z:30,fov:64,lx:0,ly:0,lz:0,dist:9};
function updateCamera(dt){
  const sp=Math.hypot(car.vx,car.vz),fr=clamp(sp/car.spec.maxSpeed,0,1.4);
  let target=car.a;
  if(sp>8){const vel=Math.atan2(-car.vx,-car.vz);let df=vel-car.a;df=Math.atan2(Math.sin(df),Math.cos(df));if(Math.abs(df)<1.4)target=car.a+df*.45}
  let df=target-cam.yaw;df=Math.atan2(Math.sin(df),Math.cos(df));
  cam.yaw+=df*(1-Math.exp(-(4.6+fr*2.8)*dt));
  const sy=Math.sin(cam.yaw),cy=Math.cos(cam.yaw);
  const want=8.6+fr*3.4,hgt=3.5+fr*.9;
  /* clip check, walk out from the car toward the desired spot */
  let free=want;
  for(let t=1.5;t<=want;t+=1.3){const px=car.x+sy*t,pz=car.z+cy*t;if(insideCollider(px,pz,car.y+hgt,.9)){free=Math.max(2.4,t-1.4);break}}
  cam.dist=free<cam.dist?damp(cam.dist,free,22,dt):damp(cam.dist,free,3,dt);
  const tx=car.x+sy*cam.dist,tz=car.z+cy*cam.dist;
  let ty=car.y+hgt;ty=Math.max(ty,surfaceAt(tx,tz)+1.4);
  cam.x=damp(cam.x,tx,14,dt);cam.z=damp(cam.z,tz,14,dt);cam.y=damp(cam.y,ty,car.grounded?9:5,dt);
  cam.lx=damp(cam.lx,car.x-sy*7,12,dt);cam.lz=damp(cam.lz,car.z-cy*7,12,dt);cam.ly=damp(cam.ly,car.y+1.5,8,dt);
  const reduced=G.reduced?0:1;
  car.shake=Math.max(0,car.shake-dt*1.7);
  const s=car.shake*car.shake*2.2*reduced;
  camera.position.set(cam.x+rnd(-s,s),cam.y+rnd(-s,s),cam.z+rnd(-s,s));
  camera.lookAt(cam.lx,cam.ly,cam.lz);
  const base=baseFov();
  cam.fov=damp(cam.fov,base+Math.max(0,fr-.25)*20+(car.boosting?9:0),4,dt);
  camera.fov=cam.fov;camera.updateProjectionMatrix();
}
function baseFov(){return camera.aspect<1?78:62}

/* ========= Car visuals ========= */
function updateCarVisual(dt){
  const a=car.a,fx=-Math.sin(a),fz=-Math.cos(a),rx=Math.cos(a),rz=-Math.sin(a),e=1.6;
  let pt=0,rl=0;
  if(car.grounded){
    const hf=surfaceAt(car.x+fx*e,car.z+fz*e,car.y),hb=surfaceAt(car.x-fx*e,car.z-fz*e,car.y),hr=surfaceAt(car.x+rx,car.z+rz,car.y),hl=surfaceAt(car.x-rx,car.z-rz,car.y);
    pt=Math.atan2(hf-hb,e*2);rl=Math.atan2(hr-hl,2);
  } else pt=clamp(car.vy*.018,-.45,.45);
  const vf=car.vx*fx+car.vz*fz;
  const leanP=(input.gas&&vf<car.spec.maxSpeed*.7?.035:0)-(input.brake&&vf>2?.075:0);
  const leanR=car.grounded?car.steer*clamp(Math.abs(vf)/car.spec.maxSpeed,0,1)*.13:0;
  car.pitch=damp(car.pitch,pt+leanP,12,dt);car.roll=damp(car.roll,rl+leanR,10,dt);
  car.squash=Math.max(0,car.squash-dt*2.2);
  carRoot.position.set(car.x,car.y,car.z);
  carRoot.rotation.set(0,a,0);
  carModel.rotation.order='YXZ';carModel.rotation.x=car.pitch;carModel.rotation.z=car.roll;
  const q=Math.sin(car.squash*Math.PI)*.22;carModel.scale.set(1+q*.5,1-q,1+q*.5);
  carModel.position.y=(Math.abs(vf)<3&&!G.reduced)?Math.sin(G.time*46)*.012:0;
  car.wheel+=vf*dt/.42;carWheels.forEach(w=>w.rotation.x=-car.wheel);
  carFront.forEach(p=>p.rotation.y=-car.steer*.5);
  brakeL.visible=input.brake>0;
  carLamp.material.color.set(G.trip?0xffc531:0x3ddc6e);
  /* shadow slot 0 */
  const g=surfaceAt(car.x,car.z,car.y),air=clamp((car.y-g)/8,0,.6);
  tmpO.position.set(car.x,g+.17,car.z);tmpO.rotation.set(0,a,0);tmpO.scale.set(3.3*(1+air),1,6*(1+air));tmpO.updateMatrix();world3.sh.setMatrixAt(0,tmpO.matrix);world3.sh.instanceMatrix.needsUpdate=true;
}

function updateMini(hail){
  const cv=$('mini'),c=cv.getContext('2d'),W=cv.width,R=W/2,scale=R/190;

function resize(){
  const a=$('app'),w=a.clientWidth||innerWidth,h=a.clientHeight||innerHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
function frame(now){
  requestAnimationFrame(frame);
  const raw=Math.min((now-last)/1000,.1);last=now;const dt=Math.min(raw,.05);
  /* adaptive resolution */
  slow=damp(slow,raw,1.2,raw);
  if(slow>.034&&renderer.getPixelRatio()>1&&G.state==='play'){renderer.setPixelRatio(Math.max(1,renderer.getPixelRatio()-.35));resize();slow=.02}
  world.water.offset.x+=dt*.015;world.water.offset.y+=dt*.04;

  if(G.state==='menu'||G.state==='over'){
    G.time+=dt;
    const a=now*.00016;
    if(G.state==='menu'){
      Object.assign(car,{x:line(2)+35,z:10.5,a:-Math.PI/2,vx:0,vz:0,vy:0,steer:0,grounded:true,squash:0});car.y=surfaceAt(car.x,car.z);
      const port=camera.aspect<1,R=port?11:8.8;
      camera.position.set(car.x+Math.sin(a)*R,car.y+(port?3.2:2.5),car.z+Math.cos(a)*R);camera.lookAt(car.x,car.y+.9,car.z);
      const w=renderer.domElement.clientWidth||1,h=renderer.domElement.clientHeight||1;
      if(port)camera.setViewOffset(w,h,0,h*.13,w,h);else camera.setViewOffset(w,h,w*.24,-h*.17,w,h);
      camera.fov=baseFov();camera.updateProjectionMatrix();
      carRoot.visible=true;updateCarVisual(dt);
    } else {
      camera.position.set(car.x+Math.sin(a*3)*11,car.y+3.4,car.z+Math.cos(a*3)*11);camera.lookAt(car.x,car.y+1,car.z);
      if(!G.finDone){
        G.finT+=dt;const q=clamp(G.finT/1.3,0,1),sh=Math.round(G.cash*(1-Math.pow(1-q,3)));
        if(sh!==G.finShown){G.finShown=sh;$('fin').textContent='$'+sh.toLocaleString();if(hudTick++%3===0)Snd.rollTick()}
        if(q>=1){G.finDone=true;const r=$('rank');r.style.visibility='visible';r.classList.remove('stamp');void r.offsetWidth;r.classList.add('stamp');Snd.door();if(G.isBest){$('newbest').hidden=false;Snd.fanfare()}}
      }
    }
    updateTraffic(dt,20,false);updatePeds(dt);updateParticles(dt);updateProps(dt,now/1000);
    updateSpeedLines(dt,0);
    world3.sh.instanceMatrix.needsUpdate=true;
  } else if(G.state==='play'){
    if(carRoot)carRoot.visible=true;
    G.time+=dt;readInput();
    G.hornT=Math.max(0,G.hornT-dt);G.scrape=Math.max(0,G.scrape-dt);
    if(G.count>0){
      G.count-=dt;const c1=Math.max(0,Math.ceil(G.count));
      if(c1!==G.countShown){G.countShown=c1;if(c1>0){float(String(c1),'big');Snd.count(c1)}else{G.count=0;float('GO!','big');Snd.count(0);Snd.ambience(true);playStation()}}
      input.brake=1;input.gas=0;input.boost=false;input.drift=false;car.vx=car.vz=0;
    }
    if(G.count<=0){const n=Math.max(1,Math.ceil(dt/(1/90)));for(let i=0;i<n;i++)stepCar(dt/n)}
    updateCarVisual(dt);
    const {hail,hailD}=updatePassengers(dt);
    const speed=Math.hypot(car.vx,car.vz),m=mode();
    /* pickup */
    if(!G.trip&&hail&&G.count<=0&&hailD<CFG.zones.pickupR&&speed<CFG.zones.pickupSpeed)board(hail);
    if(G.count<=0)Music.setLayer(G.trip||!stationSong()?1:0);
    /* active trip */
    if(G.trip){
      const t=G.trip,d=Math.hypot(t.dest.x-car.x,t.dest.z-car.z);
      t.best=Math.min(t.best,d);
      if(m.trip){t.left-=dt;
        if(t.left<=5&&Math.ceil(t.left)<G.tripBeep){G.tripBeep=Math.ceil(t.left);Snd.beep(false)}
      }
      world3.dest.chev.position.y=9+Math.sin(G.time*3)*.8;world3.dest.chev.rotation.y+=dt*2;
      if(d<CFG.zones.dropR&&speed<CFG.zones.dropSpeed&&G.trip.p.state!=='boarding')deliver();
      else if(m.trip&&t.left<=0)failTrip();
    }
    /* game clock */
    if(G.state==='play'&&m.clock&&G.count<=0){
      G.clock-=dt;Music.urgent=G.clock<=CFG.clock.lowAt;
      if(G.clock<=CFG.clock.lowAt&&Math.ceil(G.clock)<G.lastBeep){G.lastBeep=Math.ceil(G.clock);Snd.beep(true)}
      if(G.clock>CFG.clock.lowAt)G.lastBeep=99;
      if(G.clock<=0){G.clock=0;gameOver()}
    }
    if(G.state==='play'){
      /* keep a supply near the driver */
      if(!G.trip&&!hail)fillPassengers();
      if(hudTick%90===0&&passengers.filter(p=>p.state==='wait').length<CFG.passengers)fillPassengers();
      const target=Math.min(CFG.traffic.max,CFG.traffic.base+G.level*CFG.traffic.perLevel);
      updateTraffic(dt,target,true);updatePeds(dt);updateParticles(dt);updateProps(dt,now/1000);
      updateCamera(dt);updateArrow(hail,dt);updateHUD(dt,hail,hailD);
      const fr=clamp(speed/(car.spec.maxSpeed*1.35),0,1);Snd.engine({fr,th:(G.count>0?(input.key.KeyW||input.key.ArrowUp?1:0):input.gas),slip:car.slip,boost:car.boosting,water:car.water,scrape:G.scrape>0,air:!car.grounded,pitch:car.spec.id==='hauler'?46:car.spec.id==='rocket'?76:60});
      updateSpeedLines(dt,G.reduced?0:(car.boosting?1:clamp((speed/car.spec.maxSpeed-.74)*2.4,0,.75)));
    }
    scene.getObjectByName('sky').position.copy(camera.position);
  } else if(G.state==='paused'){ /* frozen */ }
  scene.getObjectByName('sky').position.set(camera.position.x,0,camera.position.z);
  renderer.render(scene,camera);
}

function repaintAds(){const c=world.atlas.canvas.getContext('2d'),w=1024,h=1024;ADS.forEach(([t,bg,fg],i)=>{const x=(i%2)*w/2,y=Math.floor(i/2)*h/4,W=w/2,H=h/4;c.fillStyle=bg;c.fillRect(x,y,W,H);c.strokeStyle=fg;c.lineWidth=10;c.strokeRect(x+14,y+14,W-28,H-28);c.fillStyle=fg;c.textAlign='center';c.textBaseline='middle';c.font='400 70px Bungee,Impact,sans-serif';const ws=t.split(' ');if(ws.length>2){c.fillText(ws.slice(0,2).join(' '),x+W/2,y+H*.36,W-60);c.fillText(ws.slice(2).join(' '),x+W/2,y+H*.68,W-60)}else{c.font='400 84px Bungee,Impact,sans-serif';c.fillText(t,x+W/2,y+H/2+4,W-60)}});world.atlas.needsUpdate=true}
function boot(){
  if(!window.THREE){$('err').hidden=false;$('err').textContent='The 3D engine did not load. Check your connection and reload the page.';$('menu').hidden=true;return}
  try{initScene()}catch(e){$('err').hidden=false;$('err').textContent='This device could not start WebGL, which Fare Game needs to draw the city.';$('menu').hidden=true;return}
  G.reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
  input.touch=isTouchDevice();$('app').classList.toggle('touch',input.touch);
  genCity();
  mapCache.c=(()=>{const c=document.createElement('canvas');c.width=c.height=1024;c.getContext('2d').drawImage(world.map,0,0,1024,1024);return c})();
  buildActorResources();initProps();buildRoadGraph();initTraffic();
  car.spec=CFG.vehicles[0];
  initPeds();for(let i=0;i<20;i++){const c=traffic[i];spawnCar(c,false)}
  initTouch();
  $('keys').innerHTML=input.touch
    ?'Use the <b>joystick</b>: push up to drive, push up-left or up-right to turn, pull down to brake and reverse. <b>Drift</b> takes tight turns. Sound needs your ringer on.'
    :'<b>WASD</b> or <b>arrows</b> drive. <b>Space</b> drift. <b>Shift</b> boost. <b>H</b> honk. <b>N</b> radio. <b>R</b> tow. <b>P</b> pause. <b>M</b> mute.';
  renderMenu();
  $('start').onclick=()=>{Snd.init();Snd.ui();startGame()};$('again').onclick=()=>{Snd.ui();startGame()};$('restart').onclick=()=>{Snd.ui();startGame()};$('radio').onclick=nextStation;$('radio2').onclick=nextStation;
  $('volM').value=Math.round(Snd.musicVol*100);$('volS').value=Math.round(Snd.sfxVol*100);
  $('volM').oninput=e=>{Snd.musicVol=e.target.value/100;Snd.applyLevels();try{localStorage.setItem('fg_music',Snd.musicVol)}catch(_){}};
  $('volS').oninput=e=>{Snd.sfxVol=e.target.value/100;Snd.applyLevels();try{localStorage.setItem('fg_sfx',Snd.sfxVol)}catch(_){}};
  $('resume').onclick=()=>{Snd.ui();resume()};$('quit').onclick=()=>{Snd.ui();toMenu()};$('toMenu').onclick=()=>{Snd.ui();toMenu()};$('pauseBtn').onclick=()=>{Snd.ui();pauseGame()};
  addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));resize();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{landmarks.forEach(l=>{const c=l.tex.canvas.getContext('2d'),w=320,h=80;c.fillStyle='#1b1430';c.fillRect(0,0,w,h);c.strokeStyle='#ffc531';c.lineWidth=6;c.strokeRect(5,5,w-10,h-10);c.fillStyle='#fff3d6';c.font='700 38px "Barlow Condensed",Arial Narrow,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(l.name.toUpperCase(),w/2,h/2+1,w-24);l.tex.needsUpdate=true});repaintAds()});
  requestAnimationFrame(t=>{last=t;frame(t)});
  window.__fare={Snd,Music,SONGS,stepCar,G,car,input,passengers,traffic,startGame,camera,board,CFG,landmarks,float};
}
boot();
</script>
